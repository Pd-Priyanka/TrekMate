spring:
  application:
    name: ${SPRING_APPLICATION_NAME:trekmate-backend}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trekmate?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
server:
  port: ${PORT:${SERVER_PORT:8080}}
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
logging:
  config: classpath:logback-spring.xml
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.trekmate: ${LOG_LEVEL_APP:INFO}

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  openweather:
    api-key: ${OPENWEATHER_API_KEY:}
    base-url: ${OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
