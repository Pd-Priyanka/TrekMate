server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/javascript,text/css,text/html,text/plain

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    locations: classpath:db/postgresql-migration
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.trekmate: ${LOG_LEVEL_APP:INFO}

app:
  cors:
    allowed-origin: ${FRONTEND_URL:https://placeholder.invalid}
  jwt:
    secret: ${JWT_SECRET}
