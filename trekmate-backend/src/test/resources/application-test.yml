spring:
  datasource:
    url: jdbc:h2:mem:trekmate;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,USERS;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-jwt-secret-key-with-at-least-thirty-two-characters
    expiration-ms: 3600000
