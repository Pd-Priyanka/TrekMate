services:
  postgres:
    image: postgres:16-alpine
    container_name: trekmate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trekmate}
      POSTGRES_USER: ${POSTGRES_USER:-trekmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trekmate}
    ports: [ "${POSTGRES_PORT:-5432}:5432" ]
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: trekmate-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trekmate.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports: [ "${PGADMIN_PORT:-5050}:80" ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [ "pgadmin_data:/var/lib/pgadmin" ]
volumes:
  postgres_data:
  pgadmin_data: